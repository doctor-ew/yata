name: Bug report
description: Report a reproducible problem. This issue is public.
title: 'Bug: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or app version and device
  - type: markdown
    attributes:
      value: Do not post private links, email addresses, credentials, or chat transcripts.
