name: Feature or content request
description: Suggest a feature, channel, or original-era show.
title: 'Request: '
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: Describe the result you want. Content suggestions still need playable sources.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: How would you use it?
  - type: markdown
    attributes:
      value: This issue is public. Do not include email addresses, private server URLs, tokens, or personal information.
