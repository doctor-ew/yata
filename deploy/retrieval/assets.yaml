AWSTemplateFormatVersion: '2010-09-09'
Description: YATA retrieval deployment artifacts; private, versioned, retained.
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      Tags: [{Key: Repository, Value: doctor-ew/yata}]
  ArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
Outputs:
  ArtifactsBucket: {Value: !Ref Artifacts}
